aid: arzeda
name: Arzeda
description: 'Arzeda Corp is a Seattle, Washington protein design company — "The Protein
  Design Company" — founded in 2008 by David Baker (2024 Nobel Prize in Chemistry),
  Alexandre Zanghellini and colleagues out of the University of Washington Institute
  for Protein Design. Its Intelligent Protein Design Technology combines physics-based
  computational protein design, generative AI and an agentic design-build-test-learn
  loop over fifteen years of proprietary in-house experimental data to create designer
  enzymes and proteins that do not exist in nature, then scale them to commercial production.
  Commercial programs span food and beverage (ViaLeaf Reb M / ProSweet Reb M stevia
  sweeteners with MANE), home and personal care enzymes (Unilever), advanced materials
  (W. L. Gore & Associates) and pharmaceutical biologics (Takeda), alongside DARPA
  and NSF funded work on AI-driven protein design and cell-free biomanufacturing. Arzeda
  co-founded the OpenFold consortium for open-source protein structure prediction.
  It sells designed molecules and joint development programs, not software, and publishes
  no public developer program, API or machine-readable interface.'
